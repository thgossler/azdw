title: azdw Docs
description: Cross-tenant work-item and portfolio intelligence for Azure DevOps and GitHub.
url: https://thgossler.github.io
baseurl: /azdw
repository: thgossler/azdw
remote_theme: just-the-docs/just-the-docs@main

permalink: pretty

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-include-cache

color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  focus_shortcut_key: k

nav_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

enable_copy_code_button: true

relative_links:
  enabled: true
  collections: true

optional_front_matter:
  remove_originals: true